<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>나 연애할 때 얼마나 정병임?</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');

  :root {
    --bg: #fff9f5;
    --card: #ffffff;
    --text: #1a1a1a;
    --sub: #888;
    --accent: #ff4d6d;
    --accent2: #ffd166;
    --accent3: #06d6a0;
    --border: #f0e8e0;
    --shadow: 0 4px 24px rgba(255,77,109,0.10);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 0 48px 0;
  }

  /* ── SCREENS ── */
  .screen { display: none; width: 100%; max-width: 480px; padding: 0 20px; }
  .screen.active { display: flex; flex-direction: column; }

  /* ── INTRO ── */
  #screen-intro {
    align-items: center;
    text-align: center;
    padding-top: 60px;
    gap: 0;
  }
  .intro-emoji {
    font-size: 72px;
    animation: bounce 1.8s infinite;
    display: block;
    margin-bottom: 16px;
  }
  @keyframes bounce {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }
  .intro-title {
    font-size: 26px;
    font-weight: 900;
    line-height: 1.3;
    margin-bottom: 10px;
    word-break: keep-all;
  }
  .intro-title span { color: var(--accent); }
  .intro-sub {
    font-size: 14px;
    color: var(--sub);
    line-height: 1.7;
    margin-bottom: 32px;
    word-break: keep-all;
  }
  .tag-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-bottom: 36px;
  }
  .tag {
    background: #fff0f3;
    border: 1.5px solid #ffd0da;
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 13px;
    color: var(--accent);
    font-weight: 700;
  }
  .btn-start {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 16px;
    padding: 18px 0;
    width: 100%;
    font-size: 18px;
    font-weight: 900;
    cursor: pointer;
    letter-spacing: -0.3px;
    box-shadow: 0 6px 24px rgba(255,77,109,0.28);
    transition: transform 0.12s, box-shadow 0.12s;
  }
  .btn-start:active { transform: scale(0.97); box-shadow: 0 2px 8px rgba(255,77,109,0.18); }
  .disclaimer {
    margin-top: 20px;
    font-size: 12px;
    color: #bbb;
  }

  /* ── QUIZ ── */
  #screen-quiz { padding-top: 32px; gap: 0; }

  .progress-wrap {
    margin-bottom: 20px;
  }
  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--sub);
    margin-bottom: 8px;
    font-weight: 700;
  }
  .progress-bar {
    width: 100%;
    height: 6px;
    background: var(--border);
    border-radius: 999px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 999px;
    transition: width 0.4s cubic-bezier(.4,0,.2,1);
  }

  .q-card {
    background: var(--card);
    border-radius: 24px;
    padding: 28px 22px 22px;
    box-shadow: var(--shadow);
    border: 1.5px solid var(--border);
    margin-bottom: 20px;
    animation: fadeSlide 0.35s ease;
  }
  @keyframes fadeSlide {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .q-num {
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 10px;
    letter-spacing: 1px;
  }
  .q-text {
    font-size: 17px;
    font-weight: 900;
    line-height: 1.5;
    word-break: keep-all;
  }

  .choices { display: flex; flex-direction: column; gap: 11px; }
  .choice-btn {
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 14px;
    padding: 15px 16px;
    font-size: 14.5px;
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 700;
    color: var(--text);
    cursor: pointer;
    text-align: left;
    line-height: 1.5;
    word-break: keep-all;
    transition: border-color 0.15s, background 0.15s, transform 0.1s;
  }
  .choice-btn:hover {
    border-color: var(--accent);
    background: #fff5f7;
  }
  .choice-btn:active { transform: scale(0.98); }
  .choice-btn.selected {
    border-color: var(--accent);
    background: #fff0f3;
    color: var(--accent);
  }

  /* ── LOADING ── */
  #screen-loading {
    align-items: center;
    justify-content: center;
    min-height: 80vh;
    text-align: center;
    gap: 18px;
  }
  .loading-emoji {
    font-size: 64px;
    animation: spin 1.2s linear infinite;
    display: block;
  }
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  .loading-text { font-size: 16px; color: var(--sub); font-weight: 700; }

  /* ── RESULT ── */
  #screen-result { padding-top: 36px; gap: 0; }

  .result-header {
    text-align: center;
    margin-bottom: 24px;
  }
  .result-emoji-big {
    font-size: 80px;
    display: block;
    margin-bottom: 10px;
    animation: pop 0.5s cubic-bezier(.36,1.8,.58,1) both;
  }
  @keyframes pop {
    from { transform: scale(0.4); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }
  .result-label {
    font-size: 13px;
    font-weight: 700;
    color: var(--sub);
    letter-spacing: 1px;
    margin-bottom: 6px;
  }
  .result-type {
    font-size: 30px;
    font-weight: 900;
    color: var(--accent);
    margin-bottom: 6px;
  }
  .result-oneliner {
    font-size: 14px;
    color: var(--sub);
    word-break: keep-all;
    line-height: 1.6;
  }

  .result-card {
    background: var(--card);
    border-radius: 24px;
    padding: 24px 20px;
    box-shadow: var(--shadow);
    border: 1.5px solid var(--border);
    margin-bottom: 14px;
  }
  .result-card-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 10px;
    letter-spacing: 0.5px;
  }
  .result-desc {
    font-size: 14.5px;
    line-height: 1.8;
    word-break: keep-all;
    color: #333;
  }
  .result-desc b { color: var(--accent); }

  .worst-match {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #fff5f7;
    border-radius: 14px;
    padding: 14px 16px;
    margin-top: 4px;
  }
  .worst-emoji { font-size: 32px; }
  .worst-info { flex: 1; }
  .worst-name { font-size: 15px; font-weight: 900; color: var(--accent); }
  .worst-why { font-size: 13px; color: var(--sub); margin-top: 2px; line-height: 1.5; }

  .share-section {
    margin-top: 8px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .share-text-box {
    background: #f8f8f8;
    border-radius: 14px;
    padding: 16px;
    font-size: 13px;
    color: #555;
    line-height: 1.7;
    word-break: keep-all;
    border: 1.5px dashed var(--border);
  }
  .btn-share {
    background: var(--text);
    color: #fff;
    border: none;
    border-radius: 14px;
    padding: 16px;
    font-size: 15px;
    font-weight: 900;
    font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .btn-share:active { opacity: 0.8; }
  .btn-retry {
    background: transparent;
    color: var(--sub);
    border: 2px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    font-size: 14px;
    font-weight: 700;
    font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer;
  }

  .toast {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #1a1a1a;
    color: #fff;
    padding: 12px 24px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 700;
    font-family: 'Noto Sans KR', sans-serif;
    opacity: 0;
    transition: all 0.35s cubic-bezier(.4,0,.2,1);
    z-index: 999;
    white-space: nowrap;
  }
  .toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }
</style>
</head>
<body>

<!-- ── INTRO ── -->
<div id="screen-intro" class="screen active">
  <span class="intro-emoji">💊</span>
  <h1 class="intro-title">나 연애할 때<br><span>얼마나 정병임?</span></h1>
  <p class="intro-sub">12문항으로 알아보는<br>나의 연애 정신건강 상태 🩺<br>웃기다가 뜨끔할 수 있음 주의</p>
  <div class="tag-row">
    <span class="tag">멘헤라형</span>
    <span class="tag">감정파형</span>
    <span class="tag">집착형</span>
    <span class="tag">회피형</span>
    <span class="tag">불안형</span>
    <span class="tag">방치형</span>
    <span class="tag">애정결핍형</span>
    <span class="tag">삐돌이형</span>
  </div>
  <button class="btn-start" onclick="startQuiz()">테스트 시작하기 →</button>
  <p class="disclaimer">※ 재미로만 봐주세요. 진단 아님.</p>
</div>

<!-- ── QUIZ ── -->
<div id="screen-quiz" class="screen">
  <div class="progress-wrap">
    <div class="progress-label">
      <span id="q-label">Q1 / 12</span>
      <span id="q-percent">0%</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
  </div>
  <div class="q-card">

  </div>
  <div class="choices" id="choices"></div>
</div>

<!-- ── LOADING ── -->
<div id="screen-loading" class="screen">
  <span class="loading-emoji">🔬</span>
  <p class="loading-text">정병 유형 분석 중…</p>
</div>

<!-- ── RESULT ── -->
<div id="screen-result" class="screen">
  <div class="result-header">
    <span class="result-emoji-big" id="r-emoji"></span>
    <div class="result-label">당신의 연애 유형은</div>
    <div class="result-type" id="r-type"></div>
    <div class="result-oneliner" id="r-oneliner"></div>
  </div>

  <div class="result-card">
    <div class="result-card-title">📋 상세 분석</div>
    <div class="result-desc" id="r-desc"></div>
  </div>

  <div class="result-card">
    <div class="result-card-title">💀 최악의 궁합</div>
    <div class="worst-match">
      <span class="worst-emoji" id="r-worst-emoji"></span>
      <div class="worst-info">
        <div class="worst-name" id="r-worst-name"></div>
        <div class="worst-why" id="r-worst-why"></div>
      </div>
    </div>
  </div>

  <div class="result-card">
    <div class="result-card-title">📤 친구한테 보내기</div>
    <div class="share-section">
      <div class="share-text-box" id="r-share-text"></div>
      <button class="btn-share" onclick="copyShare()">📋 공유 문구 복사하기</button>
      <button class="btn-retry" onclick="retry()">🔄 다시 테스트하기</button>
    </div>
  </div>
</div>

<div class="toast" id="toast">클립보드에 복사됐어요!</div>

<script>
// ── DATA ──

// ── STATE ──
let current = 0;
let scores = { 멘헤라:0, 감정파:0, 집착:0, 회피:0, 불안:0, 방치:0, 애정결핍:0, 삐돌이:0 };

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

function startQuiz() {
  current = 0;
  scores = { 멘헤라:0, 감정파:0, 집착:0, 회피:0, 불안:0, 방치:0, 애정결핍:0, 삐돌이:0 };
  show('screen-quiz');
  renderQuestion();
}

function renderQuestion() {
  const q = questions[current];
  const pct = Math.round((current / questions.length) * 100);
  document.getElementById('q-label').textContent = `Q${current+1} / ${questions.length}`;
  document.getElementById('q-percent').textContent = pct + '%';
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('q-num').textContent = `Q${current+1}`;
  document.getElementById('q-text').textContent = q.q;

  const choicesEl = document.getElementById('choices');
  choicesEl.innerHTML = '';
  // shuffle choices
  const shuffled = [...q.choices].sort(() => Math.random() - 0.5);
  shuffled.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = c.text;
    btn.onclick = () => selectChoice(c.type, btn);
    choicesEl.appendChild(btn);
  });
}

function selectChoice(type, btn) {
  document.querySelectorAll('.choice-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  scores[type]++;
  setTimeout(() => {
    current++;
    if (current < questions.length) {
      renderQuestion();
    } else {
      showLoading();
    }
  }, 340);
}

function showLoading() {
  show('screen-loading');
  setTimeout(showResult, 1800);
}

function showResult() {
  const top = Object.entries(scores).sort((a,b) => b[1]-a[1])[0][0];
  const r = results[top];
  document.getElementById('r-emoji').textContent = r.emoji;
  document.getElementById('r-type').textContent = r.type;
  document.getElementById('r-oneliner').textContent = r.oneliner;
  document.getElementById('r-desc').innerHTML = r.desc;
  document.getElementById('r-worst-emoji').textContent = r.worstEmoji;
  document.getElementById('r-worst-name').textContent = r.worstName;
  document.getElementById('r-worst-why').textContent = r.worstWhy;
  const shareUrl = window.location.href.split('?')[0].split('#')[0];
  document.getElementById('r-share-text').textContent =
    `나 연애할 때 얼마나 정병인지 테스트했는데\n결과가 "${r.type}" 나왔어ㅋㅋ\n${r.oneliner}\n\n너는 몇 나왔어? → ${shareUrl}`;
  show('screen-result');
}

function copyShare() {
  const text = document.getElementById('r-share-text').textContent;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(showToast).catch(() => fallbackCopy(text));
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  showToast();
}

function showToast() {
  const t = document.getElementById('toast');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function retry() {
  show('screen-intro');
}
